<header><img src="assets/hunu-logo.png" alt="HUNNU"><div><h1>Бартерын хөрөнгийн орон сууц, зогсоол</h1><div class="intro">2026.10.27 — танилцуулгын мэдээлэл</div></div><nav><a href="index.html">Автомашин</a><a href="apartments.html">Орон сууц</a></nav></header>

.value==='asc'?a.price-b.price:b.price-a.price);document.getElementById('count').textContent=list.length+' хөрөнгө';cards.replaceChildren();for(const x of list){const card=document.createElement('article');card.className='card';const image=document.createElement('img');image.src=x.image;image.alt=x.name;image.loading='lazy';const d=document.createElement('div');d.className='details';const title=document.createElement('h2');title.textContent=x.name;const type=document.createElement('div');type.className='tag';type.textContent=x.kind;const price=document.createElement('div');price.className='price';price.textContent=money(x.price);const meta=document.createElement('div');meta.className='meta';meta.textContent=[x.area+' м²','Давхар: '+x.floor,x.unit?'Тоот: '+x.unit:'',x.rooms?'Өрөө: '+x.rooms:'',x.location,'Нэгж үнэ: '+money(x.unitPrice)].filter(Boolean).join(' · ');d.append(type,title,price,meta);if(x.note){const n=document.createElement('div');n.className='note';n.textContent='Анхаар: '+x.note;d.append(n)}card.append(image,d);cards.append(card)}}[q,kind,sort].forEach(x=>x.addEventListener('input',render));render();</script></body></html>
